name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK, NDK, and CMake
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          echo "Ensuring platform 36 and build-tools are present..."
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" || true

          # Locate preinstalled NDK and export ANDROID_NDK_ROOT
          PREINSTALLED_NDK="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [ -n "${PREINSTALLED_NDK}" ] && [ -d "${PREINSTALLED_NDK}" ]; then
            echo "Using preinstalled NDK: ${PREINSTALLED_NDK}"
            echo "ANDROID_NDK_HOME=${PREINSTALLED_NDK}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=${PREINSTALLED_NDK}" >> $GITHUB_ENV
          else
            echo "Installing default NDK..."
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" || true
            LATEST_NDK="$(find "${ANDROID_HOME}/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            echo "ANDROID_NDK_HOME=${LATEST_NDK}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=${LATEST_NDK}" >> $GITHUB_ENV
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew || true

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sa-pc-runner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

